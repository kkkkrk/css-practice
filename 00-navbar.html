<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta http-equiv="X-UA-Compatible" content="ie=edge">
	<title>CSS Flex</title>
	<link rel="stylesheet" href="default.css">
	<style>
		.menu{
			display: flex;
			width: 70%;
			height: 50px;
			margin: 0 auto;
		}
		.menu-list{
			background-color: gold;
			flex: 1 1 auto;
		}
		.menu-list:hover{
			background-color: crimson;
			flex: 1.2;
			transition: 0.3s;
		}
		.menu-link{
			width: 100%;
			height: 100%;
			line-height: 50px;
			display: block;
			font-weight: bold;
			text-decoration: none;
			text-align: center;
			font-size: 20px;
			color: #333;
		}
		.menu-link:hover{
			color: white;
		}
	</style>
</head>
<body>
	<ul class="menu">
		<li class="menu-list"><a href="#" class="menu-link">홈</a></li>
		<li class="menu-list"><a href="#" class="menu-link">정보</a></li>
		<li class="menu-list"><a href="#" class="menu-link">제품</a></li>
		<li class="menu-list"><a href="#" class="menu-link">연락</a></li>
	</ul>
</body>
</html>
